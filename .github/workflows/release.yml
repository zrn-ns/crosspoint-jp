name: Compile Release
on:
  push:
    tags:
      - '*'
  # release-dispatch.yml がタグ ref を指定して起動する。GITHUB_TOKEN で push した
  # タグは push イベントを発生させないため、上の push トリガーだけでは足りない。
  workflow_dispatch:

jobs:
  build-release:
    # タグ以外の ref で誤って dispatch された場合に Release を作らないためのガード。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Deploy Flasher を workflow_dispatch で起動するのに必要
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # scripts/git_branch.py derives CROSSPOINT_VERSION with `git describe`,
          # which needs the tags and enough history to reach them.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # platformio.ini に version を書き戻すステップは不要になった。
      # scripts/git_branch.py が git tag から直接 CROSSPOINT_VERSION を決める。

      # ビルド開始時刻を CROSSPOINT_BUILD_TIME として埋める。正式/RC リリースは
      # タグにタイムスタンプを持たないため、OTA で Dev Build と時系列比較する
      # にはバイナリ側にキーが必要になる (src/BuildInfo.h 参照)。
      - name: Stamp build time
        id: buildtime
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build CrossPoint
        env:
          CROSSPOINT_BUILD_TIME: ${{ steps.buildtime.outputs.value }}
        run: |
          set -euo pipefail
          pio run -e gh_release

          firmware="$(find .pio/build -maxdepth 3 -type f -path "*/firmware.bin" | grep "/gh_release/" | head -n1)"
          bootloader="$(find .pio/build -maxdepth 3 -type f -path "*/bootloader.bin" | grep "/gh_release/" | head -n1)"
          partitions="$(find .pio/build -maxdepth 3 -type f -path "*/partitions.bin" | grep "/gh_release/" | head -n1)"

          if [ -z "${firmware}" ] || [ -z "${bootloader}" ] || [ -z "${partitions}" ]; then
            echo "Expected gh_release artifacts not found."
            find .pio/build -maxdepth 4 -type f | sort || true
            exit 1
          fi

          cp "${firmware}" firmware.bin
          cp "${bootloader}" bootloader.bin
          cp "${partitions}" partitions.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            bootloader.bin
            partitions.bin
            firmware.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrossPoint Reader JP ${{ github.ref_name }}
          files: |
            firmware.bin
            bootloader.bin
            partitions.bin
          # body はヘッダーとして使われ、generate_release_notes が有効な場合は
          # その下に GitHub が自動生成する変更点 (マージされた PR の一覧 / 新規 contributor /
          # Full Changelog リンク) が追記される。
          body: |
            ## CrossPoint Reader JP ${{ github.ref_name }}

            ### 📦 ファームウェア

            | ファイル | 言語 |
            |---------|------|
            | `firmware.bin` | 日本語 / English |

            ### 📥 インストール方法

            1. USB-C でデバイスをPCに接続
            2. `firmware.bin` をダウンロードし、フラッシュツールで書き込み
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # この run が release-dispatch.yml から workflow_dispatch で起動された場合、
      # run 自体が GITHUB_TOKEN 由来なので完了時に workflow_run イベントが発生せず、
      # deploy-flasher.yml の `workflow_run: workflows: ["Compile Release"]` が連鎖しない。
      # そのため Web Flasher のマニフェストが古いリリースを指したままになる。
      # タグ push で起動された場合は通常どおり連鎖するので、その場合は何もしない。
      - name: Trigger flasher deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_run で起動されたときと同じ ref を使う
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run deploy-flasher.yml --ref "${REF}"; then
              echo "Deploy Flasher を起動しました。"
              exit 0
            fi
            echo "Deploy Flasher の起動に失敗しました (${attempt}/3)。再試行します。"
            sleep 5
          done
          echo "::error::Deploy Flasher の起動に失敗しました。Release は作成済みなので、Actions から Deploy Flasher を手動実行してください。"
          exit 1
