name: Dev Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/**'
      - 'lib/EpdFont/scripts/**'
      - 'scripts/generate-font-manifest.py'

concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # scripts/git_branch.py derives CROSSPOINT_VERSION with `git describe`,
          # which needs the tags and enough history to reach them.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      # 再実行ガード (#117)。ワークフローを再実行すると GITHUB_SHA は元のコミット
      # のまま、タイムスタンプだけが「今」になる。その間にリリースタグが切られて
      # いると「タグ名は最新なのに中身は古い」Dev Build ができ、正式リリースに
      # 乗っている端末が Dev チャネルで一度ダウングレードしてしまう。
      # HEAD から到達できる最新のリリースタグより新しい v* タグが存在するなら、
      # この HEAD の Dev Build は既に古いのでスキップする。
      - name: Check for newer release tag
        id: guard
        run: |
          reachable="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD 2>/dev/null || true)"
          newest="$(git tag --list 'v[0-9]*' | sort -V | tail -n1)"
          echo "reachable=${reachable:-<none>} newest=${newest:-<none>}"
          skip=false
          if [ -n "${newest}" ] && [ "${newest}" != "${reachable}" ]; then
            higher="$(printf '%s\n%s\n' "${reachable}" "${newest}" | sort -V | tail -n1)"
            if [ "${higher}" = "${newest}" ]; then
              skip=true
              echo "::warning::HEAD より新しいリリースタグ ${newest} が存在するため Dev Build をスキップします (HEAD は ${reachable:-タグなし} 以降)"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      # ビルドより前に実行する。TIMESTAMP はタグ名 (dev-<stamp>) と
      # ファームウェアに埋め込む CROSSPOINT_BUILD_TIME の両方の出所であり、
      # この2つがバイト単位で一致することが「端末が自分自身を更新候補と
      # みなさない」ための条件になっている (src/BuildInfo.h 参照)。
      - name: Generate release metadata
        id: meta
        if: steps.guard.outputs.skip != 'true'
        run: |
          TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
          DISPLAY_TIME="$(date -u +'%Y-%m-%d %H:%M:%S')"
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG="$(git log -1 --pretty=%s)"

          echo "build_time=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "tag_name=dev-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "release_name=Dev Build ${DISPLAY_TIME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

      - name: Build CrossPoint
        if: steps.guard.outputs.skip != 'true'
        env:
          CROSSPOINT_BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          set -euo pipefail
          pio run -e gh_release

          firmware="$(find .pio/build -maxdepth 3 -type f -path "*/firmware.bin" | grep "/gh_release/" | head -n1)"
          bootloader="$(find .pio/build -maxdepth 3 -type f -path "*/bootloader.bin" | grep "/gh_release/" | head -n1)"
          partitions="$(find .pio/build -maxdepth 3 -type f -path "*/partitions.bin" | grep "/gh_release/" | head -n1)"

          if [ -z "${firmware}" ] || [ -z "${bootloader}" ] || [ -z "${partitions}" ]; then
            echo "Expected gh_release artifacts not found."
            find .pio/build -maxdepth 4 -type f | sort || true
            exit 1
          fi

          cp "${firmware}" firmware.bin
          cp "${bootloader}" bootloader.bin
          cp "${partitions}" partitions.bin

      - name: Create Release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          make_latest: false
          files: |
            firmware.bin
            bootloader.bin
            partitions.bin
          body: |
            ## Dev Build

            | 項目 | 値 |
            |------|-----|
            | コミット | [`${{ steps.meta.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | メッセージ | ${{ steps.meta.outputs.commit_msg }} |
            | ビルド環境 | `gh_release` |

            ### 📦 アセット

            | ファイル | 用途 |
            |---------|------|
            | `firmware.bin` | OTAアップデート / フラッシュ書き込み |
            | `bootloader.bin` | 初回書き込み / 復旧用 |
            | `partitions.bin` | 初回書き込み / 復旧用 |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
