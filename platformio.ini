[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

; バージョンはここでは持たない。git tag が唯一の情報源で、
; scripts/git_branch.py が全環境の CROSSPOINT_VERSION を組み立てる。
; リリースは Actions の "Release (dispatch)" から実行する。

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude is suppressed alongside missingIncludeSystem: with
; custom_sdkconfig the framework is built from ESP-IDF sources, and pio check
; cannot reconstruct that include path, so every project header resolves to a
; [low:information] "not found" (400+ of them). They say nothing about the code
; — real defects still fail the build via --fail-on-defect low.
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
# freeink-sdk: X3/X4両対応ビルド（1バイナリでBoardConfigがランタイム選択）
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
# freeink-sdk のドライバ内部ヘッダ参照（HalDisplayのダークモードヒント用、
# <driver/Uc8279Driver.h> を解決する。SDKのSHA更新時は要追随確認）
  -I $PROJECT_DIR/freeink-sdk/libs/display/FreeInkDisplay/src
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
# Size optimization flags (CJK: needed to prevent boot loop with large CJK fonts)
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags =
  -std=gnu++11
  -fexceptions

; TLS record buffer sizing.
;
; mbedTLS ships symmetric 16KB record buffers, so by default every handshake
; wants two 16KB *contiguous* blocks. On this device (no PSRAM, a 48KB
; framebuffer in .bss) that is too much. A client only ever *sends* small
; requests, so the outgoing record can be far smaller: 2KB covers everything
; this firmware sends, the longest being the redirected GET for a GitHub release
; asset (request line 892 bytes, ~1000 with Host and a dev-build User-Agent).
;
; The inbound side cannot shrink: release-assets.githubusercontent.com and
; GitHub Pages were both measured sending full 16,408-byte TLS records for large
; bodies, so anything below 16384 breaks font and firmware downloads outright.
;
; READ THIS BEFORE TOUCHING ANY MBEDTLS OPTION HERE: none of these lines reached
; the device until 2026-08-02. pioarduino's copy-back step skipped the nested
; upstream mbedTLS archives, so the settings were compiled and discarded while
; the linker kept Espressif's prebuilt symmetric 16KB/16KB — ~33KB of record
; buffers per connection instead of ~18.5KB. That missing 14KB was what made the
; font download fail after a reading session with
; MBEDTLS_ERR_RSA_PUBLIC_FAILED + MBEDTLS_ERR_MPI_ALLOC_FAILED (-0x4290) while
; verifying the server's root certificate. scripts/patch_espidf_libcopy.py fixes
; the copy; without it, editing anything below has no effect at all.
;
; Verifying a change here is therefore not "look at sdkconfig.<env>" — that file
; is the *request*, and the copy step even writes it into the package so the
; package looks compliant. Check instead that
; framework-arduinoespressif32-libs/<chip>/lib/libmbedtls_2.a (which holds
; ssl_tls.c/ssl_msg.c) has a fresh timestamp, and that the firmware hash
; actually changed — PlatformIO's build cache will happily re-serve an ELF
; linked against the old archives.
;
; Things that look like levers and are not, all measured against the failing
; handshake and none of which moved it:
;   - The framebuffer's ~51KB: since the freeink-sdk migration it is heap-
;     allocated once in display.begin() (was a .bss member array in the old
;     open-x4-sdk). Still never returned during operation, but it now competes
;     with the TLS buffers for contiguous heap — begin() runs after the font
;     scan, so measure largest_free_block when touching anything here.
;   - WiFi buffer pools (static RX 8->4, dynamic RX/TX 32->12) and lwIP's
;     per-socket window (SND_BUF/WND 5744/5760 -> 2872). Both are allocated on
;     demand, so at handshake time almost nothing is held. Reverted rather than
;     pay throughput for a measured zero.
;   - MBEDTLS_MPI_WINDOW_SIZE. It is already effectively 1: bignum_core.c's
;     exp_mod_get_window_size() returns 1 unless the exponent exceeds 79 bits,
;     and RSA's public exponent is 65537. The modexp working buffer is 641 limbs
;     (~2.6KB), not the ~5.6KB a window of 3 would imply.
;   - CONFIG_MBEDTLS_DYNAMIC_BUFFER, which is the feature built for exactly this
;     problem. It failed to link for the same copy-back reason (port/dynamic/*.c
;     lands in the nested archive that never got copied). Worth retrying now that
;     the copy is fixed.
;
; The copy bug is fixed upstream in pioarduino 55.03.311, which also moves
; Arduino 3.3.7 -> 3.3.11 and ESP-IDF 5.5.2 -> 5.5.5. Staying on 55.03.37 keeps
; this fork aligned with crosspoint-reader upstream, which pins the same version
; and never hits the bug because it does not use custom_sdkconfig at all. The
; reasoning, and what to check before taking the upgrade, is in
; docs/adr/0001-pioarduino-platform-version.md.
;
; NOTE: setting custom_sdkconfig makes pioarduino rebuild ESP-IDF from source
; instead of using the prebuilt libs, so the first build after a clean checkout
; is much slower.
custom_sdkconfig =
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

; Managed components that the Arduino package pulls in but this firmware never
; uses. They are dead weight on the prebuilt-lib path; on the from-source path
; that custom_sdkconfig forces, the RainMaker/Insights family actively breaks
; the build — their CMake embeds certificate files (https_server.crt,
; rmaker_mqtt_server.crt) that the project is expected to supply.
;
; esp-dsp goes too: its only consumer here was PNGdec's s3_simd_rgb565.S, which
; scripts/patch_pngdec.py now restricts to the ESP32-S3 it was written for.
custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/network_provisioning
  espressif/esp-zigbee-lib
  espressif/esp-zboss-lib
  espressif/esp-modbus
  espressif/esp-dsp
  espressif/cbor
  espressif/qrcode

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/check_cjk_ui_font.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_pngdec.py
; Without this, every mbedTLS option in custom_sdkconfig below is compiled and
; then silently discarded — see the script's header.
  pre:scripts/patch_espidf_libcopy.py
; verifyRollbackLater() の override がリンクで勝っているかをビルド後に検証する。
; 失敗しても無言で「OTAロールバックが効かない」状態になるだけなので、
; ビルドを落として気付けるようにしている。
  post:scripts/check_rollback_hook.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
custom_i18n_languages = ENGLISH, JAPANESE


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py from the git tag
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
custom_i18n_languages = ENGLISH, JAPANESE
